name: Backfill Market Breadth 5Y

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests finance-datareader
      - name: Build 5-year breadth history
        env:
          BREADTH_BACKFILL_YEARS: "5"
          BREADTH_BACKFILL_COUNT: "1650"
          BREADTH_WORKERS: "12"
        run: python backfill_breadth_5y.py
      - name: Commit breadth data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breadth_close_history.csv data/breadth_history.csv
          if git diff --cached --quiet; then
            echo "No breadth changes"
          else
            git commit -m "Backfill 5-year market breadth"
            git push
          fi
